<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Muestra del sistema de diseño</title>
<link rel="stylesheet" href="tokens.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:var(--font-sans);background:#d9dce1;padding:28px;display:flex;gap:28px;justify-content:center}
.tel{width:390px;background:var(--color-bg);color:var(--color-text);border-radius:36px;overflow:hidden;box-shadow:var(--shadow-pop);position:relative;border:8px solid #0d0f12}
.cab{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px}.cab h1{font-size:20px;margin:0}
.muted{color:var(--color-text-muted)}.xs{font-size:12px;line-height:16px;font-weight:500}.sm{font-size:14px}
.res{margin:8px 16px;background:var(--color-surface);border-radius:var(--radius-lg);padding:16px}
.disp{font-size:40px;line-height:44px;font-weight:700;font-variant-numeric:tabular-nums;margin:2px 0 8px}
.bar{height:8px;border-radius:999px;background:var(--color-border);overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;border-radius:999px}
.row{display:flex;justify-content:space-between;gap:12px}
.dia{padding:12px 16px 4px;display:flex;justify-content:space-between}
.mov{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:56px}
.ico{width:40px;height:40px;border-radius:12px;background:var(--color-accent-soft);color:var(--color-accent);display:flex;align-items:center;justify-content:center;font-weight:700}
.mov .m{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}.ing{color:var(--color-success)}
.sec{padding:10px 16px 0}.sec h2{font-size:14px;margin:6px 0 8px;color:var(--color-text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.b{height:44px;padding:0 16px;border-radius:var(--radius-md);font:600 16px var(--font-sans);border:1px solid transparent;display:inline-flex;align-items:center}
.p{background:var(--color-accent);color:var(--color-on-accent)}.s{background:var(--color-surface);color:var(--color-text);border-color:var(--color-border)}.g{background:none;color:var(--color-accent)}.d{background:var(--color-danger);color:var(--color-on-accent)}.f{outline:2px solid var(--color-focus);outline-offset:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--color-border-input);display:inline-flex;align-items:center;font-size:14px;font-weight:500}.chip.on{background:var(--color-accent-soft);border-color:var(--color-accent);color:var(--color-text)}
.campo{border:1px solid var(--color-border-input);border-radius:var(--radius-md);height:52px;display:flex;align-items:center;padding:0 14px;font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.err{border-color:var(--color-danger)}.et{color:var(--color-danger);font-size:14px;margin-top:4px}
.pr{margin:6px 0}
.toast{margin:12px 88px 0 16px;background:var(--color-text);color:var(--color-bg);border-radius:var(--radius-md);padding:12px 14px;display:flex;justify-content:space-between;font-size:14px}.toast b{color:var(--color-accent-soft)}
.fab{position:absolute;right:20px;bottom:84px;width:56px;height:56px;border-radius:50%;background:var(--color-accent);color:var(--color-on-accent);font-size:30px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-pop)}
.tabs{display:flex;justify-content:space-around;border-top:1px solid var(--color-border);height:64px;align-items:center;margin-top:16px;background:var(--color-bg)}.tab{font-size:11px;font-weight:600;color:var(--color-text-muted);text-align:center}.tab.on{color:var(--color-accent)}.tab span{display:block;font-size:18px}
.lab{font:600 13px system-ui;text-align:center;color:#33373d;margin-bottom:8px}
</style></head><body>
<div><div class="lab">Modo claro</div><div class="tel" data-theme="claro" id="t1"></div></div>
<div><div class="lab">Modo oscuro</div><div class="tel" data-theme="oscuro" id="t2"></div></div>
<template id="tpl">
<div class="cab"><h1>Octubre</h1><span class="muted sm">Mis Gastos</span></div>
<div class="res"><div class="muted sm">Puedes gastar</div><div class="disp">$412.000</div>
<div class="bar"><i style="width:68%;background:var(--color-accent)"></i></div>
<div class="row sm"><span class="muted">Gastado $888.000</span><span class="ing">+ $1.300.000</span></div></div>
<div class="dia"><span class="xs muted">HOY</span><span class="xs muted">$41.500</span></div>
<div class="mov"><div class="ico">C</div><div><div>Almuerzo</div><div class="xs muted">Comida · Nequi</div></div><div class="m">$18.000</div></div>
<div class="mov"><div class="ico">T</div><div><div>Bus</div><div class="xs muted">Transporte · Efectivo</div></div><div class="m">$3.200</div></div>
<div class="mov"><div class="ico">$</div><div><div>Pago quincena</div><div class="xs muted">Ingreso</div></div><div class="m ing">+ $1.300.000</div></div>
<div class="sec"><h2>Botones</h2><div class="btns"><span class="b p">Guardar</span><span class="b s">Cancelar</span><span class="b g">Editar</span><span class="b d">Borrar</span><span class="b p f">Con foco</span></div></div>
<div class="sec"><h2>Categoría y medio de pago</h2><div class="chips"><span class="chip on">✓ Comida</span><span class="chip">Transporte</span><span class="chip">Hogar</span><span class="chip on">✓ Nequi</span><span class="chip">Efectivo</span></div></div>
<div class="sec"><h2>Monto</h2><div class="campo">$18.000</div><div class="campo err" style="margin-top:8px;font-size:20px;color:var(--color-text-muted)">$0</div><div class="et">Escribe un monto mayor a 0</div></div>
<div class="sec"><h2>Presupuestos</h2>
<div class="pr"><div class="row sm"><span>Transporte</span><span class="muted">40 %</span></div><div class="bar"><i style="width:40%;background:var(--color-accent)"></i></div></div>
<div class="pr"><div class="row sm"><span>Comida</span><span style="color:var(--color-warning)">⚠ Vas en el 82 %</span></div><div class="bar"><i style="width:82%;background:var(--color-warning)"></i></div></div>
<div class="pr"><div class="row sm"><span>Salidas</span><span style="color:var(--color-danger)">⛔ Te pasaste por $12.000</span></div><div class="bar"><i style="width:100%;background:var(--color-danger)"></i></div></div></div>
<div class="toast"><span>Movimiento borrado</span><b>Deshacer</b></div>
<div class="fab">+</div>
<div class="tabs"><div class="tab on"><span>⌂</span>Inicio</div><div class="tab"><span>☰</span>Movimientos</div><div class="tab"><span>◎</span>Presupuestos</div><div class="tab"><span>▤</span>Reportes</div><div class="tab"><span>⚙</span>Ajustes</div></div>
</template>
<script>for(const id of ['t1','t2'])document.getElementById(id).append(document.getElementById('tpl').content.cloneNode(true))</script>
</body></html>
