  <!-- Marca de agua de Opita Digital -->
  <div class="marca-agua" aria-hidden="true"></div>

  <div id="raiz"></div>

  <!-- ============ PARTE PÚBLICA ============ -->
  <template id="tpl-publico">
    <header class="cabecera">
      <a href="#/" class="logo"><svg><use href="#marca"/></svg><span data-nombre></span></a>
      <nav class="nav-publica" aria-label="Principal">
        <a href="#/">Regístrate</a>
        <a href="#/encuestas">Encuestas</a>
        <a href="#/panel" class="nav-equipo"><svg class="icono"><use href="#i-usuario"/></svg>Iniciar sesión</a>
      </nav>
    </header>
    <main id="vista"></main>
    <footer class="pie">
      <div class="pie-fila">
        <span data-nombre></span>
        <span>Sus datos se tratan según la Ley 1581 de 2012.</span>
      </div>
      <div class="credito" data-credito></div>
    </footer>
  </template>

  <template id="tpl-registro">
    <div class="registro">
      <aside class="cartel">
        <p class="sobretitulo">Registro ciudadano · <span data-nombre></span></p>
        <h1 class="cartel-titulo" id="cartel-titulo"></h1>
        <p class="cartel-texto">Déjanos tus datos y entérate primero de las reuniones, propuestas
          y jornadas que pasan en tu comuna.</p>
        <div class="contador">
          <span class="contador-num" id="contador">—</span>
          <span class="contador-txt">personas ya se sumaron</span>
        </div>
        <!-- Montañas del Huila (decoración de los diseños Elegante y Opita) -->
        <svg class="cartel-montanas" viewBox="0 0 1440 260" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
          <path class="m-lejos" d="M0 190L120 150 220 170 340 112 420 136 520 82 600 58 668 78 742 122 862 96 982 142 1102 104 1222 150 1342 124 1440 160V260H0Z"/>
          <path class="m-cresta" d="M0 190L120 150 220 170 340 112 420 136 520 82 600 58 668 78 742 122 862 96 982 142 1102 104 1222 150 1342 124 1440 160"/>
          <path class="m-nieve" d="M556 72L600 58 644 71 626 80 608 72 590 83 574 76Z"/>
          <path class="m-medio" d="M0 222L160 178 300 206 460 162 620 202 780 152 940 196 1100 166 1280 206 1440 182V260H0Z"/>
          <path class="m-cerca" d="M0 246C240 216 480 252 720 232S1200 214 1440 240V260H0Z"/>
        </svg>
      </aside>

      <form id="form-registro" class="formulario" novalidate>
        <fieldset>
          <legend><span class="paso">01</span> ¿Quién eres?</legend>
          <div class="campos dos">
            <div class="campo">
              <label for="r-nombre">Nombre</label>
              <input id="r-nombre" maxlength="60" autocomplete="given-name" required>
            </div>
            <div class="campo">
              <label for="r-apellido">Apellido</label>
              <input id="r-apellido" maxlength="60" autocomplete="family-name" required>
            </div>
            <div class="campo">
              <label for="r-cedula">Cédula</label>
              <input id="r-cedula" inputmode="numeric" maxlength="13" required placeholder="Sin puntos ni espacios">
            </div>
            <div class="campo">
              <label for="r-edad">Edad</label>
              <input id="r-edad" type="number" min="18" max="120" inputmode="numeric" required>
            </div>
            <div class="campo ancho-completo">
              <label for="r-telefono">Teléfono o celular</label>
              <input id="r-telefono" type="tel" maxlength="15" autocomplete="tel" required placeholder="300 000 0000">
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend><span class="paso">02</span> ¿Dónde vives?</legend>
          <div class="campos dos">
            <div class="campo autocompletar">
              <label for="r-barrio">Barrio</label>
              <input id="r-barrio" maxlength="80" required autocomplete="off"
                     role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="sugerencias-barrio">
              <ul id="sugerencias-barrio" class="sugerencias" role="listbox" hidden></ul>
            </div>
            <div class="campo">
              <label for="r-comuna">Comuna</label>
              <input id="r-comuna" maxlength="40" required placeholder="Ej.: 5">
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend><span class="paso">03</span> Firma</legend>
          <div class="firma-caja" id="r-firma">
            <canvas id="firma" width="640" height="200" aria-label="Espacio para firmar"></canvas>
            <span class="firma-linea" aria-hidden="true"></span>
            <span class="firma-guia" id="firma-guia">Firma aquí con el dedo o el mouse</span>
            <button type="button" id="borrar-firma" class="enlace firma-borrar">Borrar</button>
          </div>

          <label class="consentimiento">
            <input type="checkbox" id="r-autorizacion" required>
            <span>Autorizo de manera libre, previa y expresa el tratamiento de mis datos personales
              para fines de la campaña (Ley 1581 de 2012). Puedo consultarlos, corregirlos o
              pedir que se eliminen cuando quiera.</span>
          </label>
        </fieldset>

        <p class="error" id="error-registro" role="alert"></p>
        <button type="submit" class="boton boton-acento boton-grande">Sumarme a la campaña</button>
      </form>
    </div>
  </template>

  <template id="tpl-registro-ok">
    <section class="exito">
      <svg class="exito-marca"><use href="#marca"/></svg>
      <h1 id="gracias"></h1>
      <p>Tus datos quedaron guardados. Pronto te contactaremos con novedades de tu comuna.</p>
      <button type="button" id="otro-registro" class="boton">Registrar a otra persona</button>
    </section>
  </template>

  <template id="tpl-encuestas-publicas">
    <section class="pagina-angosta">
      <p class="sobretitulo">Tu opinión cuenta</p>
      <h1 class="titulo-pagina">Encuestas abiertas</h1>
      <ul id="lista-encuestas" class="lista-encuestas"></ul>
    </section>
  </template>

  <template id="tpl-encuesta">
    <section class="pagina-angosta">
      <a href="#/encuestas" class="volver">← Todas las encuestas</a>
      <p class="sobretitulo" id="estado-encuesta"></p>
      <h1 class="titulo-pagina" id="titulo"></h1>
      <p class="meta" id="meta"></p>
      <form id="form-votar" hidden>
        <div id="opciones-voto" class="opciones"></div>
        <p class="error" id="error-votar" role="alert"></p>
        <button type="submit" class="boton boton-acento">Enviar mi voto</button>
      </form>
      <div id="resultados" class="barras" hidden></div>
      <div class="acciones">
        <button type="button" id="copiar" class="boton boton-borde">Copiar enlace</button>
      </div>
    </section>
  </template>

  <!-- ============ ACCESO DEL EQUIPO ============ -->
  <template id="tpl-login">
    <div class="acceso">
      <header class="acceso-barra">
        <a href="#/" class="logo"><svg><use href="#marca"/></svg><span data-nombre></span></a>
        <span class="pastilla-sesion"><svg class="icono"><use href="#i-usuario"/></svg>Iniciar sesión</span>
      </header>
      <div class="acceso-tarjeta">
        <div class="acceso-banda">
          <div class="acceso-logo" id="acceso-logo"></div>
          <h1 class="acceso-nombre" data-nombre></h1>
          <p class="acceso-eslogan" id="acceso-eslogan"></p>
        </div>
        <form id="form-login" class="acceso-form" novalidate>
          <h2>Iniciar sesión</h2>
          <p class="meta">Acceso para el equipo de campaña.</p>
          <div class="campo">
            <label for="correo-login">Correo</label>
            <input id="correo-login" type="email" autocomplete="username" placeholder="nombre@correo.com">
          </div>
          <div class="campo">
            <label for="clave">Contraseña</label>
            <div class="campo-icono">
              <input id="clave" type="password" autocomplete="current-password" required placeholder="Su contraseña">
              <button type="button" class="icono-boton boton-ojo" data-ojo="clave" aria-label="Mostrar contraseña" title="Mostrar contraseña"><svg><use href="#i-ojo"/></svg></button>
            </div>
          </div>
          <p class="error" id="error-login" role="alert"></p>
          <button type="submit" class="boton boton-acento boton-bloque boton-grande">Entrar</button>
          <button type="button" id="olvide" class="enlace enlace-centro">Olvidé mi contraseña</button>
        </form>

        <form id="form-codigo" class="acceso-form caja-olvide" novalidate hidden>
          <h3>Revise su correo</h3>
          <p class="meta">Le enviamos un código de 6 dígitos a <b id="codigo-correo"></b> para confirmar que el correo es suyo. Solo se pide la primera vez.</p>
          <div class="campo">
            <label for="codigo-entrada">Código</label>
            <input id="codigo-entrada" class="entrada-codigo" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••">
          </div>
          <p class="error" id="error-codigo" role="alert"></p>
          <button type="submit" class="boton boton-acento boton-bloque">Verificar y entrar</button>
          <div class="reenviar"><button type="button" id="reenviar-codigo" class="enlace" disabled>Reenviar código</button><span id="espera-codigo" class="meta"></span></div>
          <p class="ayuda-correo">¿No le llega? Espere un minuto y revise <b>Spam</b> o <b>Promociones</b>. Si sigue sin llegar, el director puede marcar su correo como verificado en Usuarios.</p>
          <button type="button" class="enlace enlace-centro" data-volver-login>Volver</button>
        </form>

        <form id="form-olvide" class="acceso-form caja-olvide" novalidate hidden>
          <h3>¿Olvidó su contraseña?</h3>
          <p class="meta">Escriba su correo. El director de la campaña recibirá el aviso y le asignará una contraseña nueva.</p>
          <div class="campo">
            <label for="correo-olvide">Correo</label>
            <input id="correo-olvide" type="email" autocomplete="username" placeholder="nombre@correo.com">
          </div>
          <p class="error" id="error-olvide" role="alert"></p>
          <p class="exito-olvide" id="exito-olvide" hidden>Listo. Si el correo tiene un perfil, el director ya puede ver su solicitud en <b>Usuarios</b>. Pregúntele por su contraseña nueva.</p>
          <div id="paso-codigo-clave" hidden>
            <p class="exito-olvide">Si el correo tiene un perfil, le llegó un código de 6 dígitos. Revise también Spam o Promociones.</p>
            <div class="campo">
              <label for="codigo-clave">Código del correo</label>
              <input id="codigo-clave" class="entrada-codigo" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••">
            </div>
            <div class="campo">
              <label for="nueva-clave">Contraseña nueva</label>
              <div class="campo-icono">
                <input id="nueva-clave" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres">
                <button type="button" class="icono-boton boton-ojo" data-ojo="nueva-clave" aria-label="Mostrar contraseña" title="Mostrar contraseña"><svg><use href="#i-ojo"/></svg></button>
              </div>
            </div>
            <div class="reenviar"><button type="button" id="reenviar-clave" class="enlace" disabled>Reenviar código</button><span id="espera-clave" class="meta"></span></div>
          </div>
          <p class="exito-olvide" id="clave-lista" hidden>Su contraseña quedó cambiada. Ya puede entrar con ella.</p>
          <div class="acciones sin-margen">
            <button type="submit" class="boton boton-acento" id="boton-olvide">Enviar</button>
            <button type="button" id="volver-login" class="boton boton-borde" data-volver-login>Volver</button>
          </div>

            <div class="campo-icono"><input id="m-clave" type="password" autocomplete="new-password" placeholder="Contraseña o clave de aplicación">
              <button type="button" class="icono-boton boton-ojo" data-ojo="m-clave" aria-label="Mostrar contraseña" title="Mostrar contraseña"><svg><use href="#i-ojo"/></svg></button></div></div>
          <div class="campo"><label for="m-nombre">Nombre que verá la gente</label><input id="m-nombre" maxlength="60" placeholder="Equipo Neiva Primero"></div>
        </div>
        <p class="error" id="error-correo" role="alert"></p>
        <div class="acciones sin-margen">
          <button type="button" id="guardar-correo" class="boton boton-acento">Guardar correo</button>
        </div>
        <div class="prueba-correo">
          <div class="campo"><label for="m-para">Enviar un correo de prueba a</label><input id="m-para" type="email" placeholder="su-correo@gmail.com"></div>
          <button type="button" id="probar-correo" class="boton boton-borde">Enviar prueba</button>
        </div>
        <div id="resultado-prueba" class="resultado-prueba" hidden></div>
        <details class="historial-correo">
          <summary>Historial de envíos <span id="cuenta-envios" class="meta"></span></summary>
          <div class="tabla-marco"><table class="tabla"><thead><tr><th>Fecha</th><th>Para</th><th>Asunto</th><th>Estado</th></tr></thead><tbody id="filas-envios"></tbody></table></div>
        </details>
      </article>
      <article class="bloque col-6 bloque-autor">
        <header class="bloque-cab"><h2>Desarrollado por</h2></header>
        <div class="autor" id="autor"></div>
      </article>
    </form>
  </template>

  <template id="tpl-panel-usuarios">
    <header class="encabezado">
      <div>
        <p class="sobretitulo">Equipo de campaña</p>
        <h1 class="titulo-pagina">Usuarios y permisos</h1>
      </div>
      <button type="button" id="nuevo-usuario" class="boton boton-acento"><svg class="icono"><use href="#i-equipo"/></svg>Nuevo perfil</button>
    </header>
    <section class="rejilla-panel">
      <article class="bloque col-5" id="bloque-form-usuario">
        <header class="bloque-cab"><h2 id="titulo-form-usuario">Nuevo perfil</h2><button type="button" id="cancelar-usuario" class="enlace" hidden>Cancelar</button></header>
        <form id="form-usuario" novalidate>
          <div class="campo"><label for="u-nombre">Nombre completo</label><input id="u-nombre" maxlength="60" autocomplete="off"></div>
          <div class="campo"><label for="u-correo">Correo</label><input id="u-correo" type="email" maxlength="120" autocomplete="off" placeholder="nombre@correo.com"></div>
          <div class="campo">
            <label for="u-clave" id="etiqueta-clave">Contraseña</label>
            <div class="campo-icono">
              <input id="u-clave" type="password" maxlength="128" autocomplete="new-password" placeholder="Mínimo 8 caracteres">
              <button type="button" class="icono-boton boton-ojo" data-ojo="u-clave" aria-label="Mostrar contraseña" title="Mostrar contraseña"><svg><use href="#i-ojo"/></svg></button>
            </div>
          </div>
          <button type="button" id="generar-clave" class="enlace boton-generar-abajo">Generar una contraseña segura</button>
          <div class="campo"><label for="u-puesto">Puesto</label><input id="u-puesto" maxlength="60" placeholder="Ej.: Coordinadora Comuna 4"></div>
          <div class="campo">
            <label for="u-rol">Rol</label>
            <select id="u-rol"></select>
          </div>
          <fieldset class="permisos">
            <legend class="etiqueta">Permisos</legend>
            <div id="u-permisos"></div>
          </fieldset>
          <label class="interruptor"><input type="checkbox" id="u-activo" checked><span>Perfil activo (puede entrar)</span></label>
          <p class="error" id="error-usuario" role="alert"></p>
          <button type="submit" class="boton boton-acento" id="guardar-usuario">Crear perfil</button>
          <p class="meta">Comparta la contraseña con la persona por un medio seguro. Ella la puede cambiar en "Mi cuenta".</p>
        </form>
      </article>
      <div class="col-7 pila" id="lista-usuarios"></div>
    </section>
  </template>

  <template id="tpl-panel-cuenta">
    <header class="encabezado">
      <div>
        <p class="sobretitulo">Mi cuenta</p>
        <h1 class="titulo-pagina" id="cuenta-nombre"></h1>
        <p class="meta" id="cuenta-detalle"></p>
      </div>
    </header>
    <section class="rejilla-panel">
      <article class="bloque col-6">
        <header class="bloque-cab"><h2>Mis permisos</h2></header>
        <ul class="lista-permisos" id="cuenta-permisos"></ul>
      </article>
      <article class="bloque col-6">
        <header class="bloque-cab"><h2>Cambiar mi contraseña</h2></header>
        <form id="form-mi-clave" novalidate>
          <div class="campo"><label for="c-actual">Contraseña actual</label><div class="campo-icono"><input id="c-actual" type="password" autocomplete="current-password"><button type="button" class="icono-boton boton-ojo" data-ojo="c-actual" aria-label="Mostrar contraseña" title="Mostrar contraseña"><svg><use href="#i-ojo"/></svg></button></div></div>
          <div class="campo"><label for="c-nueva">Contraseña nueva</label><div class="campo-icono"><input id="c-nueva" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres"><button type="button" class="icono-boton boton-ojo" data-ojo="c-nueva" aria-label="Mostrar contraseña" title="Mostrar contraseña"><svg><use href="#i-ojo"/></svg></button></div></div>
          <p class="error" id="error-mi-clave" role="alert"></p>
          <button type="submit" class="boton boton-acento">Cambiar contraseña</button>
          <span class="meta guardado" id="clave-cambiada" hidden>Contraseña cambiada</span>
        </form>
        <p class="meta" id="cuenta-maestra" hidden>Usted entró con la clave maestra. Esa clave se cambia en el servidor (variable ADMIN_PASSWORD).</p>
      </article>
    </section>
  </template>

  <div id="tooltip" class="tooltip" role="status" hidden></div>
  <script src="/vendor/qrcode.js"></script>
  <script src="/app.js"></script>
</body>
</html>
