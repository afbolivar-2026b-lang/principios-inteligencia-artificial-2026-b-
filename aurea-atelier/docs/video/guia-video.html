    win.dataset.key = key;
    if (!sh) st.innerHTML = '';
    else if (sh.i) st.innerHTML = `<img class="full" src="${C + sh.i}.png">`;
    else if (sh.q) st.innerHTML = `<img class="full" src="${sh.q[0]}">`;
    else if (sh.tall) st.innerHTML = `<img class="tall" src="${C + sh.tall}.png">`;
    else if (sh.phones) st.innerHTML = `<div class="phones">${sh.phones.map(p => `<div class="ph"><img src="${C + p}.png"></div>`).join('')}</div>`;
    else if (sh.pdf) st.innerHTML = `<div class="pdf">${sh.pdf.map(p => `<img src="${P + p}.png">`).join('')}</div>`;
  }
  if (!sh) return;
  const u = clamp(lt / sh.d), e = ease(u);
  if (sh.q) { const img = st.querySelector('img'); const n = Math.min(sh.q.length - 1, Math.floor(lt * 30)); const src = sh.q[Math.max(0, n)]; if (!img.src.endsWith(src)) img.src = src; }
  if (sh.tall) { const img = st.querySelector('img'); const h = img.naturalHeight * (1280 / img.naturalWidth); const k = ease(clamp((lt - .6) / (sh.d - 1.4))); img.style.transform = `translateY(${-(h - 800) * k}px)`; st.style.transform = ''; return; }
  if (sh.phones) { st.querySelectorAll('.ph').forEach((p, i) => { const k = ease(clamp((lt - .15 * i) / 1)); p.style.transform = `translateY(${(1 - k) * 60 + Math.sin(lt * 1.2 + i) * 6}px)`; p.style.opacity = k; const im2 = p.querySelector('img'); const hh = im2.naturalHeight * (250 / im2.naturalWidth) - 528; im2.style.transform = `translateY(${-Math.max(0, hh) * ease(clamp((lt - 1.2) / (sh.d - 1.6)))}px)`; }); return; }
  if (sh.pdf) { const pages = st.querySelectorAll('img'), n = pages.length; pages.forEach((p, i) => { const k = ease(clamp((lt - .35 * i) / 1.1)); const spread = (i - (n - 1) / 2); p.style.transform = `translate(calc(-50% + ${spread * 190 * k}px), calc(-50% + ${(1 - k) * 80}px)) rotate(${spread * 4 * k}deg) scale(${.82 + .06 * Math.cos(spread)})`; p.style.opacity = k; p.style.zIndex = 10 - Math.abs(Math.round(spread)); }); return; }
  const z = sh.z || [1, 1.08], o = sh.o || [.5, .5];
  st.style.transformOrigin = `${o[0] * 100}% ${o[1] * 100}%`;
  st.style.transform = `scale(${z[0] + (z[1] - z[0]) * e})`;
}
window.renderAt = (t) => {
  $('bar').style.width = (t / TOTAL * 100) + '%';
  const showFull = t < INTRO || t >= TOTAL - OUTRO;
  const f = $('full');
  if (t < INTRO) { fullScene('intro', t); f.style.opacity = 1 - ease(clamp((t - (INTRO - .7)) / .7)); }
  else if (t >= TOTAL - OUTRO) { fullScene('outro', t - (TOTAL - OUTRO)); f.style.opacity = ease(clamp((t - (TOTAL - OUTRO)) / .7)); }
  else f.style.opacity = 0;
  f.style.display = f.style.opacity > 0 ? 'grid' : 'none';
  const ci = SHOTS.findIndex(s => t >= s.start && t < s.start + s.d);
  const cur = SHOTS[ci], prev = ci > 0 ? SHOTS[ci - 1] : null;
  if (!cur) { setShot($('winA'), null, 0, 0); setShot($('winB'), null, 0, 0); $('text').style.opacity = 0; $('cap').style.opacity = 0; $('counter').textContent = ''; return; }
  const lt = t - cur.start, inX = clamp(lt / X);
  setShot($('winA'), cur, lt, prev ? ease(inX) : ease(inX));
  if (prev && inX < 1) setShot($('winB'), prev, t - prev.start, 1); else setShot($('winB'), null, 0, 0);
  const sc = S[cur.scene], st = t - sc.start, left = sc.end - t;
  if ($('text').dataset.k !== String(cur.scene)) {
    $('text').dataset.k = cur.scene;
    $('t-eye').textContent = 'Paso ' + (cur.scene + 1) + ' de ' + S.length; $('t-num').textContent = String(cur.scene + 1).padStart(2, '0');
    $('t-title').textContent = sc.t; $('t-desc').textContent = sc.d; $('t-list').innerHTML = sc.l.map(x => `<li>${x}</li>`).join('');
  }
  const kin = ease(clamp(st / .7)), kout = ease(clamp(left / .45));
  const k = Math.min(kin, kout);
  ['t-eye', 't-num', 't-title', 't-desc', 't-list'].forEach((id, i) => { const e = $(id); const ki = Math.min(ease(clamp((st - i * .08) / .7)), kout); e.style.opacity = ki; e.style.transform = `translateX(${(1 - ki) * -30}px)`; });
  $('text').style.opacity = 1;
  $('cap').innerHTML = `<b>${String(cur.scene + 1).padStart(2, '0')}</b> &nbsp;·&nbsp; ${cur.c}`; $('cap').style.opacity = Math.min(ease(inX), kout);
  $('counter').textContent = `Paso ${cur.scene + 1} / ${S.length}`;
  // Al cambiar de escena, la ventana entra con un leve desplazamiento.
  const winIn = ease(clamp(st / .7)); $('winA').style.transform = sc.start === cur.start ? `translateY(${(1 - winIn) * 30}px)` : '';
};
