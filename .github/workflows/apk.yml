# Arma la app para Android (APK) a partir de la página y la deja en
# sitio-andres-bolivar/descargas/andres-bolivar.apk, para descargarla desde la página.
name: App Android (APK)

on:
  push:
    paths:
      - "sitio-andres-bolivar/**"
      - "!sitio-andres-bolivar/descargas/**"
      - "app-android/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar el proyecto de Android
        working-directory: app-android
        run: |
          npm ci --no-audit --no-fund
          node preparar.mjs
          npx cap add android
          # Ícono y pantalla de inicio con la marca
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r recursos/res/* android/app/src/main/res/
          # Número de versión: uno más en cada armado
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Armar la APK
        working-directory: app-android/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Guardar la APK en la página
        run: |
          mkdir -p sitio-andres-bolivar/descargas
          cp app-android/android/app/build/outputs/apk/debug/app-debug.apk sitio-andres-bolivar/descargas/andres-bolivar.apk
          ls -la sitio-andres-bolivar/descargas

      - uses: actions/upload-artifact@v4
        with:
          name: andres-bolivar-apk
          path: sitio-andres-bolivar/descargas/andres-bolivar.apk

      # Enlace fijo para descargar la app desde el celular, con el tipo de archivo de Android:
      # https://github.com/<dueño>/<repo>/releases/download/app/OpitaDigital.apk
      - name: Publicar la APK como versión descargable
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp sitio-andres-bolivar/descargas/andres-bolivar.apk OpitaDigital.apk
          NOTAS="App Opita Digital, versión 1.${{ github.run_number }}. Toque OpitaDigital.apk para descargarla y luego Instalar."
          if gh release view app >/dev/null 2>&1; then
            gh release upload app OpitaDigital.apk --clobber
            gh release edit app --title "Opita Digital 1.${{ github.run_number }}" --notes "$NOTAS"
          else
            gh release create app OpitaDigital.apk --title "Opita Digital 1.${{ github.run_number }}" --notes "$NOTAS" --target "${GITHUB_SHA}"
          fi

      - name: Subir la APK al repositorio
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitio-andres-bolivar/descargas/andres-bolivar.apk
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "APK actualizada (versión 1.${{ github.run_number }})"
          git pull --no-rebase --no-edit origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
